name: Build and Deploy PrimeSI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install latest simple-icons
        run: pnpm add simple-icons@latest

      - name: Get simple-icons version
        id: si_version
        run: |
          VERSION=$(pnpm view simple-icons version)
          echo "version=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          VERSION=${{ steps.si_version.outputs.version }}
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q v$VERSION; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Exit if release already exists
        if: steps.check_tag.outputs.exists == 'true'
        run: echo "Release already exists. Skipping build and deploy."

      - name: Run build
        if: steps.check_tag.outputs.exists == 'false'
        run: pnpm run go

      - name: Verify artifact exists
        if: steps.check_tag.outputs.exists == 'false'
        run: ls -lah out/

      - name: Generate POM
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION=${{ steps.si_version.outputs.version }}
          cat > primesi-$VERSION.pom <<EOF
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>org.strassburger</groupId>
            <artifactId>primesi</artifactId>
            <version>${VERSION}</version>
          </project>
          EOF

      - name: Deploy to simplemavenrepo
        if: steps.check_tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.si_version.outputs.version }}
          MAVEN_DEPLOY_TOKEN: ${{ secrets.MAVEN_DEPLOY_TOKEN }}
        run: |
          BASE="${{ vars.MAVEN_REPO_URL }}/org/strassburger/primesi/$VERSION"

          upload() {
            local file="$1" name="$2"
            local status
            status=$(curl -sS -o response.txt -w '%{http_code}' \
              -X PUT \
              -H "Authorization: Bearer $MAVEN_DEPLOY_TOKEN" \
              --data-binary "@$file" \
              "$BASE/$name")
            case "$status" in
              201) echo "Uploaded $name" ;;
              409) echo "$name already published, skipping" ;;
              *)   echo "Upload of $name failed with HTTP $status:"; cat response.txt; exit 1 ;;
            esac
          }

          upload "primesi-$VERSION.pom" "primesi-$VERSION.pom"
          upload "out/primesi.jar"      "primesi-$VERSION.jar"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.si_version.outputs.version }}
          name: PrimeSI v${{ steps.si_version.outputs.version }}
          generate_release_notes: false
          files: |
            out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
